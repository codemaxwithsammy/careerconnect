<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Portal</title>
  <link rel="stylesheet" href="style.css"
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/jobs">Jobs</a>
    <a href="/post-job">Post a Job</a>
    <a href="/login">Login</a>
  </nav>
  <header>
    <h1>FIND YOUR DREAM JOB</h1>
    <p>Search thousands of jobs in seconds</p>
  </header>
  <main>
    <ul>
      <li><a href="/jobs/software-engineer">Software Engineer</a></li>
      <li><a href="/jobs/data-analyst">Data Analyst</a></li>
      <li><a href="/jobs/product-manager">Product Manager</a></li>
    </ul>
    <h2>FEATURED COMPANIES</h2>
    <ul class="companies-list">
      <li>Rubrik</li>
      <li>De Shaw</li>
      <li>Uber</li>
    </ul>
    <form>
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname">
      <span id="nameError" class="error-message"></span>
      <span id="nameSuccess" class="success-message"></span>
      
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email">
      
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone">
      
      <label for="resume">Choose File</label>
      <input type="file" id="resume" name="resume">
      
      <button type="submit">Apply</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 CareerConnect. All rights reserved.</p>
  </footer>
  <script>
      
    let nameInput= document.getElementById("fullname");
    console.log(nameInput.value);
    let applyButton=document.querySelector("button");
    applyButton.addEventListener("click",function(event){
      event.preventDefault();
      if(nameInput.value===""){
        console.log("please enter your name.")
      }else{
        console.log("Name looks good!")
      }
      
    
      let errorMessage=document.getElementById("nameError");
      let successMessage=document.getElementById("nameSuccess")
      if(nameInput.value===""){
        errorMessage.textContent= "please enter your full name";
        successMessage.textContent="";
      }else{
        errorMessage.textContent="";
        successMessage.textContent="Name looks good"
      }
    });
  </script>
</body>
</html>
